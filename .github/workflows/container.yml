name: Container

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  container-amd64:
    name: container linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.34.1
          driver: docker-container
          driver-opts: |
            image=docker.io/moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
          keep-state: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ops-pilot
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          tags: ops-pilot:ci-amd64
      - name: Smoke
        env:
          OPS_PILOT_SMOKE_IMAGE_AMD64: ops-pilot:ci-amd64
        run: go test ./test/smoke -run '^TestContainerRuntimeIsMinimal/amd64$' -count=1
  container-arm64:
    name: container linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.34.1
          driver: docker-container
          driver-opts: |
            image=docker.io/moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
          keep-state: false
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          load: true
          tags: ops-pilot:ci-arm64
      - name: Smoke
        env:
          OPS_PILOT_SMOKE_IMAGE_ARM64: ops-pilot:ci-arm64
        run: go test ./test/smoke -run '^TestContainerRuntimeIsMinimal/arm64$' -count=1
  container:
    name: container
    needs:
      - container-amd64
      - container-arm64
    runs-on: ubuntu-24.04
    steps:
      - run: true
